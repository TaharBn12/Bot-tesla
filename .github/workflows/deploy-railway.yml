name: نشر تلقائي على Railway

# يعمل عند كل دفعة تغيّر الكود، أو يدوياً من صفحة Actions
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "Dockerfile"
      - "config.yaml"
      - "railway.json"
  workflow_dispatch:
    inputs:
      reason:
        description: "سبب النشر"
        required: false
        default: "نشر يدوي"

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    name: نشر إلى Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ════════════════════════════════════════════════════════
      # تحديد نوع الرمز تلقائياً:
      #   RAILWAY_API_TOKEN  = Account/Team Token  (يعمل مع أي مشروع)
      #   RAILWAY_TOKEN      = Project Token       (مرتبط بمشروع واحد)
      # ════════════════════════════════════════════════════════
      - name: تحديد نوع الرمز
        id: kind
        env:
          API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJ_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          # إزالة أي مسافات أو أسطر جديدة عالقة من اللصق
          API_TOKEN=$(printf '%s' "$API_TOKEN" | tr -d '[:space:]')
          PROJ_TOKEN=$(printf '%s' "$PROJ_TOKEN" | tr -d '[:space:]')

          echo "طول رمز الحساب : ${#API_TOKEN}"
          echo "طول رمز المشروع: ${#PROJ_TOKEN}"
          echo "معرّف المشروع  : ${PROJECT_ID:-غير مضاف}"

          if [ -n "$API_TOKEN" ]; then
            echo "mode=account" >> "$GITHUB_OUTPUT"
            echo "✅ سيُستخدم رمز الحساب (RAILWAY_API_TOKEN)"
            if [ -z "$PROJECT_ID" ]; then
              echo "skip=1" >> "$GITHUB_OUTPUT"
              echo "::error::رمز الحساب يحتاج معرّف المشروع. أضف RAILWAY_PROJECT_ID أو استخدم Project Token في RAILWAY_TOKEN."
              exit 0
            fi
            echo "skip=0" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJ_TOKEN" ]; then
            echo "mode=project" >> "$GITHUB_OUTPUT"
            echo "✅ سيُستخدم رمز المشروع (RAILWAY_TOKEN)"
            echo "skip=0" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::لا يوجد أي رمز Railway — تم تجاوز النشر."
          fi

      - name: تثبيت Railway CLI
        if: steps.kind.outputs.skip == '0'
        run: npm install -g @railway/cli

      # ── رمز المشروع: لا يحتاج ربطاً، يجرّب النشر مباشرة ──
      - name: النشر (رمز المشروع)
        id: push_project
        if: steps.kind.outputs.skip == '0' && steps.kind.outputs.mode == 'project'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          RAILWAY_TOKEN=$(printf '%s' "$RAILWAY_TOKEN" | tr -d '[:space:]')
          export RAILWAY_TOKEN
          echo "── محاولة النشر ──"
          if railway up --ci 2>&1 | tee /tmp/deploy.log; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ── رمز الحساب: يحتاج ربط المشروع أولاً ──
      - name: ربــط المشروع (رمز الحساب)
        if: steps.kind.outputs.skip == '0' && steps.kind.outputs.mode == 'account'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          export RAILWAY_API_TOKEN=$(printf '%s' "$RAILWAY_API_TOKEN" | tr -d '[:space:]')
          echo "── التحقق من الرمز ──"
          railway whoami || true
          echo "── ربط المشروع ──"
          if [ -n "$SERVICE" ]; then
            railway link --project "$PROJECT_ID" --service "$SERVICE"
          else
            railway link --project "$PROJECT_ID"
          fi
          railway status

      - name: النشر (رمز الحساب)
        if: steps.kind.outputs.skip == '0' && steps.kind.outputs.mode == 'account'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          export RAILWAY_API_TOKEN=$(printf '%s' "$RAILWAY_API_TOKEN" | tr -d '[:space:]')
          railway up --ci 2>&1 | tee /tmp/deploy.log

      # ════════════════════════════════════════════════════════
      - name: ملخص النتيجة
        if: always()
        run: |
          {
            echo "## 🚀 نتيجة النشر على Railway"
            echo ""
            MODE="${{ steps.kind.outputs.mode }}"
            SKIP="${{ steps.kind.outputs.skip }}"
            if [ "$SKIP" = "1" ]; then
              if [ "$MODE" = "account" ]; then
                echo "⚠️ **رمز الحساب مضاف لكن ينقصه \`RAILWAY_PROJECT_ID\`.**"
                echo ""
                echo "أضفه من: Settings → Secrets → Actions، أو استخدم **Project Token** بدلاً منه."
              else
                echo "⏭️ **تم التجاوز** — لم يُضف أي رمز Railway."
              fi
            elif [ "${{ job.status }}" = "success" ]; then
              echo "✅ **نجح النشر** — الوضع: \`$MODE\`"
              echo ""
              echo "البوت على Railway أُعيد بناؤه وتشغيله."
            else
              echo "❌ **فشل النشر** — راجع السجل أعلاه."
              echo ""
              echo "| الرمز المستخدم | النتيجة |"
              echo "|---|---|"
              echo "| \`$MODE\` | فشل |"
              echo ""
              echo "أشهر سببين:"
              echo "1. **رمز حساب في خانة رمز المشروع** → استخدم \`RAILWAY_API_TOKEN\` لرمز الحساب."
              echo "2. **الرمز لا يملك صلاحية على هذا المشروع** → أعد إنشاء Project Token من داخل المشروع."
            fi
            echo ""
            echo "**الالتزام:** \`${{ github.sha }}\`"
            echo "**المشغّل:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: تنبيه تلجرام عند الفشل
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}" \
              --data-urlencode "text=❌ فشل النشر على Railway — راجع GitHub Actions" || true
          fi
