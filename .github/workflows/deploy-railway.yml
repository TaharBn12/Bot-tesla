name: نشر تلقائي على Railway

# يعمل عند كل دفعة تغيّر الكود، أو يدوياً من صفحة Actions
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - "config.yaml"
      - "railway.json"
  workflow_dispatch:
    inputs:
      reason:
        description: "سبب النشر"
        required: false
        default: "نشر يدوي"

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    name: نشر إلى Railway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ════════════════════════════════════════════════════════
      #  Railway يقبل نوعين من الرموز:
      #    Account Token  → RAILWAY_API_TOKEN   (يعمل مع أي مشروع)
      #    Project Token  → RAILWAY_TOKEN       (مرتبط بمشروع واحد)
      #  نجرّب الموجود، ثم نجرّب الآخر بنفس القيمة عند الفشل.
      # ════════════════════════════════════════════════════════
      - name: تجهيز الرموز
        id: prep
        env:
          API_SECRET: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJ_SECRET: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          API=$(printf '%s' "$API_SECRET" | tr -d '[:space:]')
          PROJ=$(printf '%s' "$PROJ_SECRET" | tr -d '[:space:]')
          echo "طول رمز الحساب : ${#API}"
          echo "طول رمز المشروع: ${#PROJ}"

          if [ -n "$API" ]; then
            echo "mode=account" >> "$GITHUB_OUTPUT"
            echo "::notice::سيُستخدم رمز الحساب (RAILWAY_API_TOKEN)"
          elif [ -n "$PROJ" ]; then
            echo "mode=project" >> "$GITHUB_OUTPUT"
            echo "::notice::سيُستخدم الرمز الموجود (RAILWAY_TOKEN) — تُجرَّب الصيغتان"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::لا يوجد رمز Railway — تجاوز النشر."
          fi

      - name: تثبيت Railway CLI
        if: steps.prep.outputs.mode != 'none'
        run: npm install -g @railway/cli

      - name: إصدار CLI
        if: steps.prep.outputs.mode != 'none'
        run: railway --version

      # ════════════ (أ) رمز حساب معروف ════════════
      - name: النشر برمز الحساب
        id: acc
        if: steps.prep.outputs.mode == 'account'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          export RAILWAY_API_TOKEN=$(printf '%s' "$RAILWAY_API_TOKEN" | tr -d '[:space:]')
          ENV_NAME="${ENVIRONMENT:-production}"
          echo "── الحساب ──"
          railway whoami 2>&1 | head -3 || true

          PID="$PROJECT_ID"
          if [ -z "$PID" ]; then
            railway list --json > /tmp/projects.json 2>/dev/null || true
            PID=$(python3 scripts/railway_discover.py projects /tmp/projects.json)
            if [ -z "$PID" ]; then
              echo "::error::لم يُحدَّد المشروع (صفر أو أكثر من مشروع). أضف RAILWAY_PROJECT_ID."
              railway list 2>&1 | head -15 || true
              exit 1
            fi
          fi
          echo "✅ المشروع: $PID"

          SVC="$SERVICE"
          if [ -z "$SVC" ]; then
            railway service list -p "$PID" -e "$ENV_NAME" --json > /tmp/svc.json 2>/dev/null || true
            SVC=$(python3 scripts/railway_discover.py services /tmp/svc.json)
          fi
          [ -n "$SVC" ] && echo "✅ الخدمة: $SVC"

          echo "── بدء النشر ──"
          if [ -n "$SVC" ]; then
            railway up --ci -p "$PID" -e "$ENV_NAME" -s "$SVC" 2>&1 | tee /tmp/deploy.log
          else
            railway up --ci -p "$PID" -e "$ENV_NAME" 2>&1 | tee /tmp/deploy.log
          fi
          echo "pid=$PID" >> "$GITHUB_OUTPUT"
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "svc=$SVC" >> "$GITHUB_OUTPUT"

      # ════════════ (ب) الرمز في خانة المشروع — محاولة ١ ════════════
      - name: المحاولة ١ — كمفتاح مشروع
        id: try_project
        if: steps.prep.outputs.mode == 'project'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          export RAILWAY_TOKEN=$(printf '%s' "$RAILWAY_TOKEN" | tr -d '[:space:]')
          echo "── محاولة النشر كمفتاح مشروع ──"
          railway up --ci 2>&1 | tee /tmp/deploy.log

      # ════════════ (ج) نفس الرمز — محاولة ٢ كمفتاح حساب ════════════
      - name: المحاولة ٢ — نفس الرمز كمفتاح حساب
        id: try_account
        if: steps.prep.outputs.mode == 'project' && steps.try_project.outcome == 'failure'
        env:
          SAME_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          export RAILWAY_API_TOKEN=$(printf '%s' "$SAME_TOKEN" | tr -d '[:space:]')
          ENV_NAME="${ENVIRONMENT:-production}"
          echo "── محاولة النشر كمفتاح حساب (البيئة: $ENV_NAME) ──"
          railway whoami 2>&1 | head -3 || true

          PID="$PROJECT_ID"
          if [ -z "$PID" ]; then
            railway list --json > /tmp/projects.json 2>/dev/null || true
            PID=$(python3 scripts/railway_discover.py projects /tmp/projects.json)
            if [ -z "$PID" ]; then
              echo "::error::الرمز صالح كمفتاح حساب لكن المشروع غير محدد. أضف RAILWAY_PROJECT_ID."
              echo "── المشاريع المتاحة ──"
              railway list 2>&1 | head -15 || true
              exit 1
            fi
          fi
          echo "✅ المشروع: $PID"

          SVC="$SERVICE"
          if [ -z "$SVC" ]; then
            railway service list -p "$PID" -e "$ENV_NAME" --json > /tmp/svc.json 2>/dev/null || true
            SVC=$(python3 scripts/railway_discover.py services /tmp/svc.json)
          fi
          [ -n "$SVC" ] && echo "✅ الخدمة: $SVC"

          echo "── بدء النشر ──"
          if [ -n "$SVC" ]; then
            railway up --ci -p "$PID" -e "$ENV_NAME" -s "$SVC" 2>&1 | tee /tmp/deploy.log
          else
            railway up --ci -p "$PID" -e "$ENV_NAME" 2>&1 | tee /tmp/deploy.log
          fi
          echo "pid=$PID" >> "$GITHUB_OUTPUT"
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "svc=$SVC" >> "$GITHUB_OUTPUT"

      # ════════════ الملخص ════════════
      - name: ملخص النتيجة
        if: always()
        run: |
          {
            echo "## 🚀 نتيجة النشر على Railway"
            echo ""
            MODE="${{ steps.prep.outputs.mode }}"
            if [ "$MODE" = "none" ]; then
              echo "⏭️ **تم التجاوز** — لا يوجد أي رمز Railway."
            elif [ "${{ job.status }}" = "success" ]; then
              if [ "${{ steps.try_project.outcome }}" = "success" ]; then
                echo "✅ **نجح النشر بمفتاح المشروع.**"
              elif [ "${{ steps.try_account.outcome }}" = "success" ]; then
                echo "✅ **نجح النشر** — عبر المحاولة ٢ (الرمز كمفتاح **حساب**)."
                echo ""
                echo "> رمزك من نوع Account Token. الأنظف وضعه في السر \`RAILWAY_API_TOKEN\`."
              else
                echo "✅ **نجح النشر** برمز الحساب."
              fi
              echo ""
              echo "| العنصر | القيمة |"
              echo "|---|---|"
              echo "| المشروع | \`${{ steps.acc.outputs.pid }}${{ steps.try_account.outputs.pid }}\` |"
              echo "| البيئة | \`${{ steps.acc.outputs.env }}${{ steps.try_account.outputs.env }}\` |"
              echo "| الخدمة | \`${{ steps.acc.outputs.svc }}${{ steps.try_account.outputs.svc }}\` |"
            else
              echo "❌ **فشل النشر في كل المحاولات.**"
              echo ""
              echo "| السبب المحتمل | الحل |"
              echo "|---|---|"
              echo "| الرمز منتهٍ أو محذوف | أنشئ رمزاً جديداً من Account Settings → Tokens |"
              echo "| الرمز بلا صلاحية على المشروع | أعد إنشاء Project Token من داخل المشروع |"
              echo "| أكثر من مشروع | أضف \`RAILWAY_PROJECT_ID\` |"
              echo "| المشروع بلا خدمة | أنشئ خدمة من لوحة Railway ثم أعد المحاولة |"
              echo "| لا يوجد رصيد/تجربة منتهية | Railway يطلب طريقة دفع بعد انتهاء الرصيد |"
            fi
            echo ""
            echo "**الالتزام:** \`${{ github.sha }}\` · **المشغّل:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: تنبيه تلجرام عند الفشل
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}" \
              --data-urlencode "text=❌ فشل النشر على Railway — راجع GitHub Actions" || true
          fi
