name: نشر تلقائي على Railway

# يعمل عند كل دفعة تغيّر الكود، أو يدوياً من صفحة Actions
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "Dockerfile"
      - "config.yaml"
      - "railway.json"
  workflow_dispatch:
    inputs:
      reason:
        description: "سبب النشر"
        required: false
        default: "نشر يدوي"

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

env:
  # مفتاح الحساب (Account Token) — يُقرأ من الأسرار
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  # مفتاح المشروع (Project Token) — بديل
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    name: نشر إلى Railway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز الرموز
        id: prep
        env:
          API_SECRET: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJ_SECRET: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # إزالة المسافات والأسطر العالقة من اللصق
          API=$(printf '%s' "$API_SECRET" | tr -d '[:space:]')
          PROJ=$(printf '%s' "$PROJ_SECRET" | tr -d '[:space:]')
          echo "طول رمز الحساب : ${#API}"
          echo "طول رمز المشروع: ${#PROJ}"

          if [ -n "$API" ]; then
            echo "mode=account" >> "$GITHUB_OUTPUT"
            echo "API token = $API" >> "$GITHUB_ENV"
            echo "::notice::سيُستخدم رمز الحساب (RAILWAY_API_TOKEN)"
          elif [ -n "$PROJ" ]; then
            echo "mode=project" >> "$GITHUB_OUTPUT"
            echo "::notice::سيُستخدم رمز المشروع (RAILWAY_TOKEN)"
            exit 0
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::لا يوجد رمز Railway — تجاوز النشر."
          fi

      - name: تثبيت Railway CLI
        if: steps.prep.outputs.mode != 'none'
        run: npm install -g @railway/cli

      # ════════════ كشف المشروع والخدمة تلقائياً ════════════
      - name: كشف المشروع
        id: find
        if: steps.prep.outputs.mode == 'account'
        env:
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          ENV_NAME="${ENVIRONMENT:-production}"
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "── الحساب ──"
          railway whoami 2>&1 | head -3 || true

          PID="$PROJECT_ID"
          if [ -z "$PID" ]; then
            echo "── المشاريع المتاحة ──"
            railway list --json > /tmp/projects.json 2>/dev/null || railway list > /tmp/projects.txt 2>&1
            if [ -s /tmp/projects.json ]; then
              cat /tmp/projects.json | head -40
              PID=$(python3 scripts/railway_discover.py projects /tmp/projects.json)
              if [ -z "$PID" ]; then
                echo "::error::يوجد أكثر من مشروع. أضف السر RAILWAY_PROJECT_ID."
                exit 1
              fi
              echo "✅ كُشف المشروع تلقائياً: $PID"
            else
              cat /tmp/projects.txt 2>/dev/null | head -20
              echo "::error::تعذّر كشف المشروع. أضف RAILWAY_PROJECT_ID من Railway → المشروع → Settings."
              exit 1
            fi
          else
            echo "✅ معرّف المشروع من الأسرار: $PID"
          fi
          echo "pid=$PID" >> "$GITHUB_OUTPUT"

          SVC="$SERVICE"
          if [ -z "$SVC" ]; then
            echo "── الخدمات في المشروع ──"
            railway service list -p "$PID" -e "$ENV_NAME" --json > /tmp/svc.json 2>/dev/null || true
            if [ -s /tmp/svc.json ]; then
              cat /tmp/svc.json | head -20
              SVC=$(python3 scripts/railway_discover.py services /tmp/svc.json)
            fi
          fi
          if [ -z "$SVC" ]; then
            echo "::warning::لم تُحدَّد الخدمة — سيُنشئ Railway خدمة من اسم المستودع."
            echo "svc=" >> "$GITHUB_OUTPUT"
          else
            echo "✅ الخدمة: $SVC"
            echo "svc=$SVC" >> "$GITHUB_OUTPUT"
          fi

      # ════════════ النشر ════════════
      - name: النشر (رمز الحساب)
        if: steps.prep.outputs.mode == 'account'
        env:
          PID: ${{ steps.find.outputs.pid }}
          ENV_NAME: ${{ steps.find.outputs.env }}
          SVC: ${{ steps.find.outputs.svc }}
        run: |
          echo "── بدء النشر ──"
          if [ -n "$SVC" ]; then
            railway up --ci -p "$PID" -e "$ENV_NAME" -s "$SVC" 2>&1 | tee /tmp/deploy.log
          else
            railway up --ci -p "$PID" -e "$ENV_NAME" 2>&1 | tee /tmp/deploy.log
          fi

      - name: النشر (رمز المشروع)
        if: steps.prep.outputs.mode == 'project'
        run: |
          echo "── بدء النشر ──"
          railway up --ci 2>&1 | tee /tmp/deploy.log

      # ════════════ الملخص ════════════
      - name: ملخص النتيجة
        if: always()
        run: |
          {
            echo "## 🚀 نتيجة النشر على Railway"
            echo ""
            MODE="${{ steps.prep.outputs.mode }}"
            if [ "$MODE" = "none" ]; then
              echo "⏭️ **تم التجاوز** — لا يوجد أي رمز Railway."
              echo ""
              echo "أضف السر \`RAILWAY_API_TOKEN\` (رمز الحساب) من:"
              echo "Settings → Secrets and variables → Actions → New repository secret"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "✅ **نجح النشر** — الوضع: \`$MODE\`"
              echo ""
              echo "| العنصر | القيمة |"
              echo "|---|---|"
              echo "| المشروع | \`${{ steps.find.outputs.pid }}\` |"
              echo "| البيئة | \`${{ steps.find.outputs.env }}\` |"
              echo "| الخدمة | \`${{ steps.find.outputs.svc }}\` |"
            else
              echo "❌ **فشل النشر** — راجع السجل أعلاه."
              echo ""
              echo "| السبب المحتمل | الحل |"
              echo "|---|---|"
              echo "| رمز حساب مضاف في \`RAILWAY_TOKEN\` | أضفه في \`RAILWAY_API_TOKEN\` بدلاً منه |"
              echo "| رمز بلا صلاحية على المشروع | أعد إنشاء الرمز من إعدادات الحساب |"
              echo "| أكثر من مشروع ولا معرّف | أضف \`RAILWAY_PROJECT_ID\` |"
              echo "| المشروع بلا خدمة | أضف \`RAILWAY_SERVICE\` أو أنشئ خدمة من لوحة Railway |"
            fi
            echo ""
            echo "**الالتزام:** \`${{ github.sha }}\` · **المشغّل:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: تنبيه تلجرام عند الفشل
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}" \
              --data-urlencode "text=❌ فشل النشر على Railway — راجع GitHub Actions" || true
          fi
