name: نشر تلقائي على Railway

# يعمل عند كل دفعة تغيّر الكود، أو يدوياً من صفحة Actions
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - "config.yaml"
      - "railway.json"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "سبب النشر"
        required: false
        default: "نشر يدوي"

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    name: نشر إلى Railway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        # مهم: بدونه `railway up | tee` يُخفي فشل Railway ويظهر نجاحاً زائفاً
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v4

      # ════════════════════════════════════════════════════════
      #  Railway يقبل نوعين من الرموز:
      #    Account Token  → RAILWAY_API_TOKEN   (يعمل مع أي مشروع)
      #    Project Token  → RAILWAY_TOKEN       (مرتبط بمشروع واحد)
      # ════════════════════════════════════════════════════════
      - name: تجهيز الرموز
        id: prep
        env:
          API_SECRET: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJ_SECRET: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          API=$(printf '%s' "$API_SECRET" | tr -d '[:space:]')
          PROJ=$(printf '%s' "$PROJ_SECRET" | tr -d '[:space:]')
          echo "طول رمز الحساب : ${#API}"
          echo "طول رمز المشروع: ${#PROJ}"
          if [ -n "$API" ]; then
            echo "mode=account" >> "$GITHUB_OUTPUT"
            echo "::notice::سيُستخدم رمز الحساب (RAILWAY_API_TOKEN)"
          elif [ -n "$PROJ" ]; then
            echo "mode=project" >> "$GITHUB_OUTPUT"
            echo "::notice::سيُستخدم الرمز الموجود (RAILWAY_TOKEN)"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::لا يوجد رمز Railway — تجاوز النشر."
          fi

      - name: تثبيت Railway CLI
        if: steps.prep.outputs.mode != 'none'
        run: npm install -g @railway/cli

      # ════════════ كشف الخدمة (مطلوب: المشروع فيه أكثر من خدمة) ════════════
      - name: كشف الخدمة
        id: svc
        if: steps.prep.outputs.mode == 'project'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_SECRET: ${{ secrets.RAILWAY_SERVICE }}
          ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: |
          export RAILWAY_TOKEN=$(printf '%s' "$RAILWAY_TOKEN" | tr -d '[:space:]')
          ENV_NAME="${ENVIRONMENT:-production}"
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"

          SVC="$SERVICE_SECRET"
          if [ -z "$SVC" ]; then
            echo "── خدمات المشروع ──"
            if ! railway service list --json > /tmp/svc.json 2>/tmp/svc.err; then
              railway service list -e "$ENV_NAME" --json > /tmp/svc.json 2>>/tmp/svc.err || true
            fi
            cat /tmp/svc.err 2>/dev/null | head -5 || true
            cat /tmp/svc.json 2>/dev/null | head -40 || true
            railway service list 2>&1 | head -20 || true
            SVC=$(python3 scripts/railway_discover.py services /tmp/svc.json 2>/dev/null || true)
          fi

          if [ -z "$SVC" ]; then
            echo "::error::المشروع فيه أكثر من خدمة. أضف السر RAILWAY_SERVICE باسم الخدمة الصحيحة (من القائمة أعلاه)."
            exit 1
          fi
          echo "✅ الخدمة: $SVC"
          echo "svc=$SVC" >> "$GITHUB_OUTPUT"

      # ════════════ النشر (رمز المشروع) ════════════
      - name: النشر برمز المشروع
        if: steps.prep.outputs.mode == 'project'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SVC: ${{ steps.svc.outputs.svc }}
        run: |
          export RAILWAY_TOKEN=$(printf '%s' "$RAILWAY_TOKEN" | tr -d '[:space:]')
          echo "── نشر الخدمة: $SVC ──"
          railway up --ci --service "$SVC" 2>&1 | tee /tmp/deploy.log
          echo "✅ اكتمل النشر بلا أخطاء"

      # ════════════ النشر (رمز الحساب) ════════════
      - name: النشر برمز الحساب
        if: steps.prep.outputs.mode == 'account'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          export RAILWAY_API_TOKEN=$(printf '%s' "$RAILWAY_API_TOKEN" | tr -d '[:space:]')
          ENV_NAME="${ENVIRONMENT:-production}"
          echo "── الحساب ──"
          railway whoami 2>&1 | head -3 || true

          PID="$PROJECT_ID"
          if [ -z "$PID" ]; then
            railway list --json > /tmp/projects.json 2>/dev/null || true
            PID=$(python3 scripts/railway_discover.py projects /tmp/projects.json)
            if [ -z "$PID" ]; then
              echo "::error::لم يُحدَّد المشروع. أضف RAILWAY_PROJECT_ID."
              railway list 2>&1 | head -15 || true
              exit 1
            fi
          fi
          echo "✅ المشروع: $PID"

          SVC="$SERVICE"
          if [ -z "$SVC" ]; then
            railway service list -p "$PID" -e "$ENV_NAME" --json > /tmp/svc.json 2>/dev/null || true
            SVC=$(python3 scripts/railway_discover.py services /tmp/svc.json)
          fi
          if [ -z "$SVC" ]; then
            echo "::error::المشروع فيه أكثر من خدمة. أضف RAILWAY_SERVICE."
            railway service list -p "$PID" -e "$ENV_NAME" 2>&1 | head -20 || true
            exit 1
          fi
          echo "✅ الخدمة: $SVC"
          echo "── بدء النشر ──"
          railway up --ci -p "$PID" -e "$ENV_NAME" -s "$SVC" 2>&1 | tee /tmp/deploy.log
          echo "✅ اكتمل النشر بلا أخطاء"

      # ════════════ الملخص ════════════
      - name: ملخص النتيجة
        if: always()
        run: |
          {
            echo "## 🚀 نتيجة النشر على Railway"
            echo ""
            MODE="${{ steps.prep.outputs.mode }}"
            if [ "$MODE" = "none" ]; then
              echo "⏭️ **تم التجاوز** — لا يوجد أي رمز Railway."
            elif [ "${{ job.status }}" = "success" ]; then
              echo "✅ **نجح النشر** — الوضع: \`$MODE\` · الخدمة: \`${{ steps.svc.outputs.svc }}\`"
              echo ""
              echo "> هذه المرة الفشل الحقيقي لا يُخفى: \`pipefail\` مفعّل."
            else
              echo "❌ **فشل النشر — ولم يُخفَ هذه المرة.**"
              echo ""
              echo "| السبب | الحل |"
              echo "|---|---|"
              echo "| أكثر من خدمة في المشروع | أضف \`RAILWAY_SERVICE\` باسم الخدمة |"
              echo "| الرمز منتهٍ أو محذوف | أنشئ رمزاً جديداً |"
              echo "| الرمز بلا صلاحية | أعد إنشاء Project Token من داخل المشروع |"
              echo "| لا رصيد في حساب Railway | أضف طريقة دفع أو رصيداً |"
            fi
            echo ""
            echo "**الالتزام:** \`${{ github.sha }}\` · **المشغّل:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: تنبيه تلجرام عند الفشل
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}" \
              --data-urlencode "text=❌ فشل النشر على Railway — راجع GitHub Actions" || true
          fi
