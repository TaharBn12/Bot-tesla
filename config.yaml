# ══════════════════════════════════════════════════════════════
#  إعدادات البوت — TrendPulse v1
#  بعد أي تعديل: أعد تشغيل البوت (Ctrl+C ثم python src/bot.py)
# ══════════════════════════════════════════════════════════════

# ---- البورصة ----
exchange: binanceusdm      # binanceusdm | bybit | okx
symbols: []                # فارغة = تلقائي: أعلى 40 زوج سيولة

# ---- الاستراتيجية ----
strategy: trend_pulse      # trend_pulse | mean_rev | ema_cross_example
strategy_params: {}        # يمكن تجاوز أي معامل هنا، مثال: {adx_min: 25}
timeframe: "4h"            # 4h = الفريم المُختبر (1h خاسر في الاختبار)
leverage: 5                # رافعة مقترحة (للإشارة فقط في وضع signals)

# ---- وتيرة الإشارات ----
scan_interval: 300         # كل 5 دقائق يفحص (الإشارات تُولد على إغلاق شمعة 4h)
cooldown_minutes: 720      # لا تكرر إشارة نفس الزوج/الاتجاه قبل 12 ساعة
max_signals_per_scan: 4    # أقصى إشارات في الدورة الواحدة
universe_size: 40          # عدد الأزواج في الوضع المكثف
signal_expiry_hours: 72    # بعدها تُعتبر الإشارة منتهية

# ---- إدارة المخاطر ----
risk_per_trade_pct: 1.0
max_open_positions: 3      # ⭐ سقف الصفقات المتزامنة (يخفض التراجع من -35% إلى -16%)

# ---- التنفيذ الآلي ----
mode: approve              # signals = إشارات فقط | approve = إشارة + زر تنفيذ يدوي | autotrade = تنفيذ تلقائي
dry_run: false             # false = الأزرار ترسل أوامر فعلية إلى Binance (Testnet ما دام ALLOW_LIVE فارغاً)
paper_balance: 1000        # الرصيد الافتراضي في الوضع الورقي
trail_atr: 3.5             # مضاعف ATR للستوب المتتبّع

# ---- مفتاح الإيقاف التلقائي (يُستخدم في وضع autotrade) ----
max_daily_loss_pct: 3.0
max_trades_per_day: 6
max_consecutive_losses: 4

# ---- ماسح السوق الكامل (يعمل في الخلفية طوال حياة البوت) ----
hotscan_interval: 120      # كل دقيقتين دورة كاملة
hot_batch_size: 60         # الأكثر ضجة يُفحص كل دورة
hot_rotate_size: 40        # بقية السوق تُفحص بالدوران (تغطية كل العملات مع الوقت)
hot_concurrency: 8         # عدد الجلب المتوازي
hot_min_readiness: 60      # أقل جاهزية تُعدّ فرصة
heat_min_volume: 1000000   # أدنى حجم تداول بالدولار ليدخل الترتيب
